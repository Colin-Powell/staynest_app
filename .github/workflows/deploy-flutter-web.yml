name: Deploy Flutter Web

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "vercel.json"
      - ".github/workflows/deploy-flutter-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staynest-production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Run Flutter widget tests
        working-directory: frontend
        run: flutter test test/widget_test.dart --plain-name "Mobile login opens as a full-page route"

      - name: Verify listing draft autosaves locally
        working-directory: frontend
        run: flutter test test/widget_test.dart --plain-name "Listing title edits are cached as a draft"

      - name: Build Flutter web
        working-directory: frontend
        run: flutter build web --release

      - name: Deploy only the Flutter web output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "::error::Configure VERCEL_TOKEN."; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::Configure VERCEL_ORG_ID."; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::Configure VERCEL_PROJECT_ID."; exit 1; }
          npx vercel@61.1.0 deploy frontend/build/web --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID"

<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="StayNest helps you find, rent, and live in your next home.">
  <meta name="theme-color" content="#3F37C9">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="StayNest">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="manifest" href="manifest.json">
  <meta name="google-signin-client_id" content="193200636263-vsbg83ntukhk0vcj8fkgtvfll3b4chk6.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <title>StayNest | Find, Rent, Live</title>

  <style>
    :root {
      color-scheme: light;
      font-family: "DM Sans", "Segoe UI", sans-serif;
      background: #f8f9fd;
      color: #172033;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(226, 235, 255, 0.8), transparent 48%),
        #f8f9fd;
      opacity: 1;
      visibility: visible;
      transition: opacity 280ms ease, visibility 280ms ease;
    }

    #app-loading.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 32px;
    }

    .loading-animation {
      display: block;
      width: 220px;
      max-width: min(64vw, 220px);
      height: auto;
      object-fit: contain;
    }

    .loading-caption {
      margin: -10px 0 0;
      color: #64708a;
      font-size: 14px;
      font-weight: 500;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 2.4s !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite" aria-label="Loading StayNest">
    <div class="loading-content">
      <img class="loading-animation" src="assets/assets/images/loading.gif" alt="">
      <p class="loading-caption">Preparing your StayNest experience</p>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('app-loading');
      if (!splash) return;
      splash.classList.add('is-hidden');
      window.setTimeout(function () { splash.remove(); }, 320);
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="StayNest helps you find, rent, and live in your next home.">
  <meta name="theme-color" content="#3F37C9">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="StayNest">

  <!-- StayNest browser icons -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="manifest" href="manifest.json">

  <title>StayNest | Find, Rent, Live</title>

  <style>
    :root {
      color-scheme: light;
      font-family: "DM Sans", "Segoe UI", sans-serif;
      background: #f8f9fd;
      color: #172033;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(226, 235, 255, 0.8), transparent 48%),
        #f8f9fd;
      opacity: 1;
      visibility: visible;
      transition: opacity 280ms ease, visibility 280ms ease;
    }

    #app-loading.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 32px;
    }

    .loading-logo {
      display: block;
      width: 184px;
      max-width: min(56vw, 184px);
      height: auto;
    }

    .loading-spinner {
      width: 38px;
      height: 38px;
      box-sizing: border-box;
      border: 3px solid #dce4fa;
      border-top-color: #3f37c9;
      border-right-color: #20a6a0;
      border-radius: 50%;
      animation: loading-spin 850ms linear infinite;
    }

    .loading-caption {
      margin: -10px 0 0;
      color: #64708a;
      font-size: 14px;
      font-weight: 500;
    }


    @keyframes loading-spin {
      to { transform: rotate(360deg); }
    }


    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 2.4s !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
  <div id="app-loading" role="status" aria-live="polite" aria-label="Loading StayNest">
    <div class="loading-content">
      <img class="loading-logo" src="logo.svg" alt="StayNest">
      <div class="loading-spinner" aria-hidden="true"></div>
      <p class="loading-caption">Preparing your StayNest experience</p>
      <div class="loading-track" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('app-loading');
      if (!splash) return;
      splash.classList.add('is-hidden');
      window.setTimeout(function () { splash.remove(); }, 320);
    }, { once: true });
  </script>

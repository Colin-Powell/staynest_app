name: property_app
description: Property rental app with map, messages, and bookings screens.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  http: ^1.6.0
  flutter_dotenv: ^5.0.3
  cached_network_image: ^3.3.1
  fl_chart: ^1.2.0
  cupertino_icons: ^1.0.6
  geolocator: ^11.0.0
  google_fonts: ^6.1.0
  phosphor_flutter: ^2.0.0
  iconify_flutter: ^0.0.7
  flutter_svg: ^2.3.0
  table_calendar: ^3.0.10
  url_launcher: ^6.1.10
  image_picker: ^1.0.0
  image_cropper: ^8.0.0
  # pin camera to a compatible older version to resolve SDK constraints
  camera: ^0.12.0+1
  shared_preferences: ^2.2.0
  socket_io_client: ^2.0.0
  visibility_detector: ^0.4.0
  uuid: ^4.5.3

  flutter_webrtc: ^1.4.1
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^22.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/data/
    - assets/images/
    - assets/illustrations/